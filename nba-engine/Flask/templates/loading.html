<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup 2026 Lab — Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="{% if embedded %}embedded-app loading-page{% endif %}">
    {% include '_desktop_titlebar.html' %}

    <div class="loading-scene">
        <div class="loading-sky"></div>
        <div class="loading-orbs">
            <div class="loading-orb loading-orb-1"></div>
            <div class="loading-orb loading-orb-2"></div>
        </div>

        <div class="loading-stage">
            <div class="loading-trophy-wrap">
                <img class="loading-trophy" src="{{ url_for('static', filename='app-icon.png') }}" alt="World Cup trophy" />
                <div class="loading-trophy-ring"></div>
            </div>
        </div>

        <div class="loading-card glass-card">
            <div class="loading-spinner-3d" id="spinner"></div>
            <h1>Loading World Cup board</h1>
            <p id="status">Building FIFA World Cup 2026 predictions…</p>
            <p class="loading-sub">Fixtures from ESPN · odds from sportsbooks</p>
            <p class="error-text" id="error" hidden></p>
            <button type="button" class="btn btn-primary loading-retry" id="btnRetry" hidden>
                Try again
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='desktop.js') }}"></script>
    <script>
        (function () {
            const statusEl = document.getElementById("status");
            const errorEl = document.getElementById("error");
            const spinner = document.getElementById("spinner");
            const btnRetry = document.getElementById("btnRetry");
            let polling = false;

            function showLoading(message) {
                statusEl.textContent = message;
                errorEl.hidden = true;
                errorEl.textContent = "";
                btnRetry.hidden = true;
                if (spinner) spinner.style.display = "";
            }

            function showError(message) {
                statusEl.textContent = "Prediction engine failed.";
                errorEl.hidden = false;
                errorEl.textContent = message || "Unknown error";
                btnRetry.hidden = false;
                if (spinner) spinner.style.display = "none";
            }

            async function poll() {
                if (polling) return;
                polling = true;
                try {
                    const res = await fetch("/api/warmup");
                    const data = await res.json();
                    if (data.status === "running") {
                        showLoading("Loading World Cup predictions…");
                        polling = false;
                        setTimeout(poll, 1500);
                        return;
                    }
                    if (data.status === "ready") {
                        window.location.replace("/?embedded=1");
                        return;
                    }
                    if (data.status === "error") {
                        showError(data.error || "Unknown error");
                        polling = false;
                        return;
                    }
                    polling = false;
                    setTimeout(poll, 1500);
                } catch (err) {
                    showLoading("Waiting for prediction server…");
                    polling = false;
                    setTimeout(poll, 1500);
                }
            }

            async function retryWarmup() {
                btnRetry.disabled = true;
                showLoading("Retrying prediction engine…");
                try {
                    const res = await fetch("/api/warmup/retry", { method: "POST" });
                    if (!res.ok) {
                        throw new Error("Retry request failed");
                    }
                    polling = false;
                    poll();
                } catch (err) {
                    showError(err.message || "Could not retry. Please reload the app.");
                } finally {
                    btnRetry.disabled = false;
                }
            }

            btnRetry.addEventListener("click", retryWarmup);

            {% if error %}
            showError({{ error|tojson }});
            {% else %}
            poll();
            {% endif %}
        })();
    </script>
</body>
</html>
