<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NBA Edge Lab — Loading</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .loading-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .loading-card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            padding: 2rem;
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(251, 146, 60, 0.35);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .loading-card h1 {
            font-size: 1.35rem;
            margin: 1rem 0 0.5rem;
        }
        .loading-card p {
            color: #94a3b8;
            margin: 0.5rem 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto;
            border: 3px solid rgba(251, 146, 60, 0.2);
            border-top-color: #fb923c;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-text {
            color: #f87171;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="loading-shell">
        <div class="loading-card">
            <div class="spinner" id="spinner"></div>
            <h1>Building today’s board</h1>
            <p id="status">Running XGBoost models for FanDuel, DraftKings, and BetMGM…</p>
            <p class="muted">First load may take 1–3 minutes.</p>
            {% if error %}
            <p class="error-text" id="error">{{ error }}</p>
            {% endif %}
        </div>
    </div>
    <script>
        (function () {
            const statusEl = document.getElementById("status");
            const errorEl = document.getElementById("error");

            async function poll() {
                try {
                    const res = await fetch("/api/warmup");
                    const data = await res.json();
                    if (data.status === "running") {
                        const step = data.step ? data.step : "models";
                        statusEl.textContent = `Loading ${step}…`;
                        setTimeout(poll, 2000);
                        return;
                    }
                    if (data.status === "ready") {
                        window.location.replace("/");
                        return;
                    }
                    if (data.status === "error") {
                        statusEl.textContent = "Prediction engine failed.";
                        if (errorEl) {
                            errorEl.textContent = data.error || "Unknown error";
                        } else {
                            const p = document.createElement("p");
                            p.className = "error-text";
                            p.textContent = data.error || "Unknown error";
                            document.querySelector(".loading-card").appendChild(p);
                        }
                        document.getElementById("spinner").style.display = "none";
                        return;
                    }
                    setTimeout(poll, 2000);
                } catch (err) {
                    statusEl.textContent = "Waiting for prediction server…";
                    setTimeout(poll, 2000);
                }
            }

            {% if not error %}
            poll();
            {% endif %}
        })();
    </script>
</body>
</html>
