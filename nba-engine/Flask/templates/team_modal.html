{% from '_team_macros.html' import team_logo %}
{% for game_key in (data.get('fanduel') or {}) %}
{% set teams = game_key.split(':') %}
{% for team in teams %}
<div class="modal fade" id="modal-{{ team|replace(' ', '-')|lower }}" tabindex="-1"
    aria-labelledby="modal-{{ team|replace(' ', '-')|lower }}-label" aria-hidden="true" data-bs-backdrop="true"
    data-team-name="{{ team|e }}">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title modal-title-team" id="modal-{{ team|replace(' ', '-')|lower }}-label">
                    {{ team_logo(team, 'md', team) }}
                    <span>{{ team }} roster</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="team-data-{{ team|replace(' ', '-')|lower }}" class="player-roster">
                    <div class="loading-spinner text-center py-4 mt-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div class="player-list" style="display: none;"></div>
                    <div class="error-message text-danger text-center py-4" style="display: none;">
                        Failed to load team data
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endfor %}
{% endfor %}

<script>
    const teamDataCache = new Map();
    const TEAM_ROSTER_CACHE_VERSION = 2;

    document.addEventListener('DOMContentLoaded', function() {
        function escapeAttr(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;")
                .replace(/</g, "&lt;");
        }

        function createPlayerCard(player) {
            const isHealthy = player.injury === 'Healthy';
            return `
                <div class="col-12 col-xl-6 mb-3">
                    <div class="player-card" role="button" tabindex="0"
                         data-player-id="${escapeAttr(player.playerId)}"
                         data-player-name="${escapeAttr(player.name || '')}">
                        <div class="d-flex align-items-start gap-3">
                            <img src="${player.headshot}"
                                 alt="${player.name}"
                                 class="player-headshot"
                                 onerror="this.src='https://cdn.nba.com/headshots/nba/latest/1040x760/fallback.png'">
                            <div class="flex-grow-1">
                                <div class="player-name">${player.name}</div>
                                <div class="tag-row">
                                    <span class="tag">#${player.jerseyNum || 'N/A'}</span>
                                    <span class="tag">${player.position || 'N/A'}</span>
                                    <span class="status-chip ${isHealthy ? 'status-healthy' : 'status-injured'}">
                                        ${isHealthy ? 'Healthy' : 'Injured'}
                                    </span>
                                </div>
                                <div class="player-meta">
                                    Height: ${player.height || 'N/A'} / Weight: ${player.weight || 'N/A'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handlePlayerCardActivate(card) {
            if (!card || !card.dataset.playerId) return;
            if (typeof window.openPlayerProfile !== 'function') {
                console.error('openPlayerProfile is not available');
                return;
            }
            window.openPlayerProfile(
                card.dataset.playerId,
                card.dataset.playerName || ''
            );
        }

        document.addEventListener('click', function(event) {
            const card = event.target.closest('.player-card[data-player-id]');
            if (!card) return;
            event.preventDefault();
            event.stopPropagation();
            handlePlayerCardActivate(card);
        });

        document.addEventListener('keydown', function(event) {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const card = event.target.closest('.player-card[data-player-id]');
            if (!card) return;
            event.preventDefault();
            handlePlayerCardActivate(card);
        });

        document.querySelectorAll('.modal[id^="modal-"]').forEach(function(modalElement) {
            modalElement.addEventListener('shown.bs.modal', function() {
                const teamName = this.dataset.teamName
                    || this.querySelector('.modal-title .team-chip-label, .modal-title span')?.textContent?.replace(/\s*roster\s*$/i, '').trim()
                    || '';
                const teamDataContainer = this.querySelector('.player-roster');
                const loadingSpinner = teamDataContainer.querySelector('.loading-spinner');
                const playerList = teamDataContainer.querySelector('.player-list');
                const errorMessage = teamDataContainer.querySelector('.error-message');

                const cacheKey = `${TEAM_ROSTER_CACHE_VERSION}:${teamName}`;
                if (teamDataCache.has(cacheKey)) {
                    playerList.innerHTML = `<div class="row">${teamDataCache.get(cacheKey)}</div>`;
                    playerList.style.display = 'block';
                    loadingSpinner.style.display = 'none';
                    return;
                }

                loadingSpinner.style.display = 'block';
                playerList.style.display = 'none';
                errorMessage.style.display = 'none';

                fetch(`/team-data/${encodeURIComponent(teamName)}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success && data.players) {
                            const playerCards = data.players
                                .sort((a, b) => a.name.localeCompare(b.name))
                                .map(player => createPlayerCard(player))
                                .join('');
                            playerList.innerHTML = `<div class="row">${playerCards}</div>`;
                            playerList.style.display = 'block';
                            teamDataCache.set(cacheKey, playerCards);
                        } else {
                            throw new Error(data.error || 'Failed to load team data');
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching team data:', error);
                        errorMessage.textContent = error.message;
                        errorMessage.style.display = 'block';
                    })
                    .finally(() => {
                        loadingSpinner.style.display = 'none';
                    });
            });
        });
    });
</script>
